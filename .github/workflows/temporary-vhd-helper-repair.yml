name: Temporary VHD helper install repair checks
on:
  push:
    branches: [fix/updater-missing-vhd-helper]
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and old-updater regression checks
        run: |
          python3 -m py_compile libexec/hangar-portable libexec/hangar-update
          python3 tests/integration/updater_helper_repair.py -v
      - name: Existing Hangar tests
        run: |
          npm run test:unit
          npm run test:smoke
      - name: Existing standalone kit and ISO roundtrip
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq restic xorriso
          sudo bash tests/integration/portable-live.sh
