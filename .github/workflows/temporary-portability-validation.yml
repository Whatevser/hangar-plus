name: Temporary repository-import and standalone ISO validation
on:
  push:
    branches: [fix/real-repository-import-and-standalone-iso]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 -m py_compile libexec/hangar-portable libexec/hangar-update libexec/hangar-run
      - run: node --check js/features/logbook-ui.js && node --check js/features/repos-ui.js && node --check js/features/settings-ui.js
      - run: npm run test:unit
      - run: npm run test:smoke
      - run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq restic xorriso
      - run: sudo bash tests/integration/portable-live.sh
