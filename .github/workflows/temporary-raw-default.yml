name: Temporary RAW default export validation
on:
  push:
    branches: [feature/raw-default-boot-disk]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Python and JS syntax
        run: |
          python3 -m py_compile libexec/hangar-vhd libexec/hangar-vhd-job libexec/hangar-portable
          node --check js/features/logbook-ui.js
          sh -n tests/integration/portable-live.sh
      - name: Offline RAW and VHDX export tests
        run: |
          python3 tests/integration/vhd_test.py -v
          python3 tests/integration/vhd_job_test.py -v
          python3 tests/integration/updater_helper_repair.py -v
      - name: Node regression and smoke tests
        run: |
          npm run test:unit
          npm run test:smoke
      - name: Standalone access kit and real restic ISO integration
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq restic xorriso
          sudo bash tests/integration/portable-live.sh
      - name: Browser UI tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:e2e
