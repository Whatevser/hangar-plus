name: Temporary Cockpit appearance validation
on:
  push:
    branches: [style/cockpit-native-appearance]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check js/app.js && node --check js/features/settings-ui.js && node --check js/core/config.js
      - name: Run unit tests
        run: npm run test:unit
      - name: Run smoke tests
        run: npm run test:smoke
      - name: Install browser test dependencies
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e
