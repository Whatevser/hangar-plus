name: Temporary experimental live ISO validation
on:
  push:
    branches: [experiment/live-snapshot-iso]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Python compilation
        run: python3 -m py_compile libexec/hangar-live-iso libexec/hangar-portable libexec/hangar-update
      - name: Guarded live ISO builder unit tests
        run: python3 tests/integration/live_iso_test.py -v
      - name: JavaScript unit tests
        run: npm run test:unit
      - name: Cockpit UI structural checks
        run: npm run test:smoke
      - name: Standalone access kit and data ISO round trip
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -qq -y restic xorriso squashfs-tools grub-common grub-pc-bin grub-efi-amd64-bin mtools
          bash tests/integration/live_iso_media.sh
          sudo bash tests/integration/portable-live.sh
